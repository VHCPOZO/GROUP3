spring.application.name=arquiteconvencionales

# DataSource: ver DatabaseConfig (DATABASE_URL, DATABASE_PRIVATE_URL, PG* o SPRING_DATASOURCE_*)

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# Thymeleaf
spring.thymeleaf.cache=${SPRING_THYMELEAF_CACHE:false}
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Servidor (Railway inyecta dinámicamente la variable PORT)
server.port=${PORT:9090}
server.forward-headers-strategy=framework
server.error.include-message=always
server.error.include-binding-errors=always